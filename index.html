function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function msg(t){document.getElementById("msg").textContent=t;}
function open_(pw,quiet){
  pw=pw.normalize("NFC").trim();
  if(!pw){return Promise.resolve(false);}
  if(!window.crypto||!crypto.subtle){msg("この開き方では使えません（https の URL から開いて下さい）");return Promise.resolve(false);}
  if(!quiet)msg("確認中…");
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"])
  .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);})
  .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},k,b64(DATA));})
  .then(function(buf){
    try{localStorage.setItem(KEY,pw);}catch(e){}
    var html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
    return true;
  },function(){
    try{localStorage.removeItem(KEY);}catch(e){}
    if(!quiet)msg("合言葉が違います");
    return false;
  });
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();open_(document.getElementById("pw").value,false);});
var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
if(saved){open_(saved,true);}
})();
